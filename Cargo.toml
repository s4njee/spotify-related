[workspace]
resolver = "2"
members = ["crates/related-core", "crates/local-player", "crates/app"]

[workspace.package]
edition = "2024"
rust-version = "1.92"
version = "0.1.0"

[workspace.dependencies]
related-core = { path = "crates/related-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
log = "0.4"
